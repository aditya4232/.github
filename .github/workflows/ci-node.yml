name: ci-node
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package.json
        id: pkg
        run: test -f package.json && echo "has=true" >> "$GITHUB_OUTPUT" || echo "has=false" >> "$GITHUB_OUTPUT"
      - if: steps.pkg.outputs.has == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - if: steps.pkg.outputs.has == 'true'
        run: npm ci
      - if: steps.pkg.outputs.has == 'true'
        run: npm run typecheck --if-present
      - if: steps.pkg.outputs.has == 'true'
        run: npm run lint --if-present
      - if: steps.pkg.outputs.has == 'true'
        run: npm test --if-present
      - if: steps.pkg.outputs.has == 'true'
        run: npm run build --if-present
